        perceived_goal: 让县衙能够复核争议，同时避免现场再被新脚印改变。
        intended_effect: 封存当前证据结构并结束本轮现场操作。
        actual_effect: 南湾争议从两条量线升级为可审计的证据矩阵，现场暂时封存，产权仍未被提前裁定。
        effects:
          - {key: boundary.review, op: set, value: evidence_matrix_pending_county}
          - {key: registration.south_field_7, op: set, value: structured_evidence_pending_ruling}
          - {key: institution.queue, op: add, value: 1}
        utility: {auditability: 9, preserve_taxpayer: 4, delay: -2}
        prose: 周继仁让人把绳和竹签都留在原处，又在草图右边划出四格。他逐格念：树根、旧沟、耕路、量线。念完才抬头，说今日谁也不许再往泥里添一只脚。
      - id: close_on_deed_language
        action: 只按契据界址词结束复测
        summary: 周继仁以文书优先结束现场争议。
        perceived_goal: 减少县衙复核负担。
        intended_effect: 形成单一待登界线。
        actual_effect: 现场操作得以结束，但耕作时间与复测过程从正式理由中消失。
        effects:
          - {key: boundary.review, op: set, value: closed_on_deed_language}
        utility: {deadline: 7, appeal_risk: -8}

recurring_processes:
  # 可重复过程拥有冷却和次数上限，状态改变后会自行停止；这类规则可用于
  # 天气、疾病、价格、生态、资源再生等连续系统。
  - id: post_flood_ground_change
    tick: dawn
    order: 130
    mode: recurring
    cooldown_days: 1
    max_firings: 3
    actor: environment
    location: 南湾七号田
    when:
      - {key: boundary.review, op: neq, value: closed}
      - {key: river.level, op: eq, value: receding}
    participants: [he_asheng, lu_jinghe]
    observers: [he_asheng, lu_jinghe, shen_yanqiu, zhou_jiren]
    options:
      - id: mud_drains_and_marks_hold
        action: 退水继续改变地表可见性
        summary: 泥面又干一层，昨日留下的脚印和量线变得可以重复辨认。
        perceived_goal: 无
        intended_effect: 无
        actual_effect: 自然过程提高了复测可靠性，也让此前的操作痕迹成为新证据。
        effects:
          - {key: measurement.iteration, op: add, value: 1}
          - {key: terrain.trace_visibility, op: add, value: 1}
        utility: {physical_continuity: 8}
        prose: 夜里没有再涨水。泥面收紧，昨日凌乱的足迹边缘反而清楚起来。

chapter:
  title: 病船
  pov: 林素云
  opening: 林素云醒来时，先听见河神庙的门板响了五下。她左耳听不清，每一下都像从水底传来；第五下以后，再没有人敲。
  closing: 船离岸以后，林素云才把凭单翻到背面。湿墨透过纸，三个字反着浮出来。她第一次知道，一个名字不仅能把人写进田里，也能把人带走。

chapters:
  - title: 退水以后
    pov: 何阿生
    when:
      - {key: south_field.control, op: eq, value: lu_workers}
    opening: 何阿生坐第一班船回洲。船户把篙递给他，他没有接；昨夜他用这双手扶过病人，现在只想知道田还认不认得他的脚。
    closing: 泥里的两行脚印分别向东、向西，都是从同一截树根开始。何阿生把伤脚踩进自己那一行，觉得今天的地比昨日多了一件证据，也多了一种丢法。
  - title: 岸上的名字
    pov: 沈砚秋
    when:
      - {key: medical_crossing.status, op: eq, value: departed_one_way}
    opening: 林素云离洲后的第一个早晨，册局里还留着她坐过的竹凳。沈砚秋把凳子推回墙边，纸上的名字却没有地方可推。
    closing: 太阳落下去以前，南湾多了七根陆家的竹签，册上多了一次林素云的异议。人和田隔着一条河，名字比船先回到了洲上。
  - title: 病船
    pov: 林素云
    when:
      - {key: lin_suyun.exit, op: eq, value: blocked}
    opening: 林素云醒来时，先听见河神庙的门板响了五下。她左耳听不清，每一下都像从水底传来；第五下以后，再没有人敲。
    closing: 船离岸以后，林素云才把凭单翻到背面。湿墨透过纸，三个字反着浮出来。她第一次知道，一个名字不仅能把人写进田里，也能把人带走。
