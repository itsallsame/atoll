limit_req_zone $binary_remote_addr zone=society_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name society.justai.cool;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name society.justai.cool;

    ssl_certificate     /etc/ssl/justai-wildcard/fullchain.pem;
    ssl_certificate_key /etc/ssl/justai-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = / {
        return 302 /society/;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8842;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /api/society {
        client_max_body_size 64k;
        limit_req zone=society_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8842;
        proxy_cookie_flags atoll_society_voter secure httponly samesite=lax;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /society/ {
        proxy_pass http://127.0.0.1:8842;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        expires 10m;
    }

    location / {
        return 404;
    }
}
