map $http_upgrade $atoll_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name staircase.justai.cool atoll.justai.cool;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://staircase.justai.cool$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staircase.justai.cool atoll.justai.cool;

    ssl_certificate     /etc/ssl/justai-wildcard/fullchain.pem;
    ssl_certificate_key /etc/ssl/justai-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;
    if ($host = atoll.justai.cool) { return 301 https://staircase.justai.cool$request_uri; }

    # Staircase is the product entry point. The /staircase mount remains an
    # internal Atoll implementation detail used only for its static assets.
    location = / {
        proxy_pass http://127.0.0.1:8832/staircase/;
        include /etc/nginx/proxy_params;
    }

    location = /staircase {
        return 308 /;
    }

    location = /staircase/ {
        return 308 /;
    }

    location / {
        proxy_pass http://127.0.0.1:8832;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $atoll_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
